[build-system]
requires = ["setuptools>=61", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "qm-circuit"
dynamic = ["version"]
description = "Quantum-circuit diagrams of QUA programs"
requires-python = ">=3.12"
dependencies = ["qm-qua>=1.4,<1.5", "matplotlib", "numpy"]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-gen-files>=0.5"]
test = ["pytest", "mypy", "ruff"]

[tool.setuptools]
packages = ["qm_circuit"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]  # I/Q are this domain's standard quadrature names, not ambiguous here
