name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: python -m ruff check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: python -m mypy qm_circuit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # First minor-version release we've verified against, plus the current minor's
        # first and latest patch. Not hard-coded to the qm-qua>=1.4,<1.5 pin in
        # pyproject.toml on purpose: this is how we discover the real compatibility floor.
        qm-qua-version: ['1.3.0', '1.4.0', '1.4.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: pip install "qm-qua==${{ matrix.qm-qua-version }}"
      - run: python -B -m pytest tests/
