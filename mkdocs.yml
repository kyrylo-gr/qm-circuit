site_name: QM-Circuit
site_description: Quantum-circuit diagrams of QUA programs, drawn offline.
site_url: https://kyrylo-gr.github.io/qm-circuit/
repo_url: https://github.com/kyrylo-gr/qm-circuit
repo_name: kyrylo-gr/qm-circuit
edit_uri: edit/main/docs/user/
docs_dir: docs/user
strict: true

theme:
  name: material
  icon:
    logo: material/sine-wave
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.share
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/viewer.js

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ['!^_']
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            unwrap_annotated: true
            members_order: source

watch:
  - qm_circuit
  - examples
  - docs/gen_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Gallery: gallery.md
  - Customising diagrams: customising.md
  - How it works: how-it-works.md
  - API reference: reference.md
